[package]
name = "coklu-protocol-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
bytes = "1"
coklu-network = { path = "../crates/network" }
coklu-protocol = { path = "../crates/protocol" }
libfuzzer-sys = "0.4"

[[bin]]
name = "protocol_decode"
path = "fuzz_targets/protocol_decode.rs"
test = false
doc = false
bench = false
