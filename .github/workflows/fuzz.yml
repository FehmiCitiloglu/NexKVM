name: Protocol Fuzz

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  protocol-fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run protocol decoder fuzz smoke
        run: cargo fuzz run protocol_decode -- -max_total_time=30
