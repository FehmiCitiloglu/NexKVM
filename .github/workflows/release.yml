name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: Test workspace
        run: cargo test --workspace --all-features

  package-linux:
    name: Linux packages (.deb/.rpm/.AppImage)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: Install system packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y rpm curl file
      - name: Build Linux packages
        shell: bash
        run: |
          chmod +x scripts/package-linux.sh
          COKLU_VERSION="${GITHUB_REF_NAME#v}" scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: coklu-linux-packages
          path: |
            target/package/*.deb
            target/package/*.rpm
            target/package/*.AppImage

  package-macos:
    name: macOS notarized bundle
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: Build macOS package (notarization optional)
        shell: bash
        env:
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          APPLE_NOTARY_PROFILE: ${{ secrets.APPLE_NOTARY_PROFILE }}
        run: |
          chmod +x scripts/package-macos.sh
          COKLU_VERSION="${GITHUB_REF_NAME#v}" scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: coklu-macos-package
          path: |
            target/package/*.zip

  package-windows:
    name: Windows installer (.exe)
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: Install NSIS
        run: choco install nsis -y
      - name: Install ImageMagick
        run: choco install imagemagick -y
      - name: Build Windows installer
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: coklu-windows-installer
          path: target/package/coklu-windows-x64-setup.exe

  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - package-linux
      - package-macos
      - package-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
