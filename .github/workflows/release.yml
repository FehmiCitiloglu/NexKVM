name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Release quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@1725d1806acf0cd664ecc8dd0fcff6d896453dcf # cargo-deny
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          workspace_version="$(cargo pkgid -p nexkvm)"
          workspace_version="${workspace_version##*@}"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$workspace_version" ]]; then
            echo "Tag version $tag_version does not match workspace version $workspace_version" >&2
            exit 1
          fi
      - name: Format
        run: cargo fmt --all -- --check
      - name: Validate packaging shell syntax
        shell: bash
        run: |
          bash -n scripts/package-macos.sh
          bash -n scripts/validate-macos-package.sh
          bash -n scripts/tests/test-package-macos.sh
          bash -n scripts/tests/test-workflow-actions-pinned.sh
          bash scripts/tests/test-workflow-actions-pinned.sh
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --all-features
      - name: API documentation
        run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Build release profile
        run: cargo build --workspace --release --all-features
      - name: Audit dependencies
        run: >-
          cargo deny --target aarch64-apple-darwin
          --exclude nexkvm-platform-linux
          --exclude nexkvm-platform-windows
          check advisories bans licenses sources

  protocol-fuzz-smoke:
    name: Protocol fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # master
        with:
          toolchain: nightly-2026-07-15
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install cargo-fuzz
        run: cargo +nightly-2026-07-15 install cargo-fuzz --version 0.13.2 --locked
      - name: Run protocol decoder fuzz smoke
        run: cargo +nightly-2026-07-15 fuzz run protocol_decode -- -max_total_time=30

  package-macos:
    name: macOS arm64 signed and notarized bundle
    needs: [verify, protocol-fuzz-smoke]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.88.0
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Test macOS package contract
        shell: bash
        run: bash scripts/tests/test-package-macos.sh
      - name: Import Developer ID certificate and configure notarization
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          required=(
            APPLE_CERTIFICATE_BASE64
            APPLE_CERTIFICATE_PASSWORD
            APPLE_CODESIGN_IDENTITY
            APPLE_NOTARY_KEY_BASE64
            APPLE_NOTARY_KEY_ID
            APPLE_NOTARY_ISSUER_ID
          )
          for variable in "${required[@]}"; do
            if [[ -z "${!variable}" ]]; then
              echo "Required macOS release secret $variable is missing" >&2
              exit 1
            fi
          done

          certificate_path="$RUNNER_TEMP/developer-id.p12"
          api_key_path="$RUNNER_TEMP/notary-api-key.p8"
          keychain_path="$RUNNER_TEMP/nexkvm-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          notary_profile="nexkvm-ci-${GITHUB_RUN_ID}"
          trap 'rm -f "$certificate_path" "$api_key_path"' EXIT
          printf 'APPLE_NOTARY_PROFILE=%s\n' "$notary_profile" >> "$GITHUB_ENV"
          printf 'APPLE_NOTARY_KEYCHAIN=%s\n' "$keychain_path" >> "$GITHUB_ENV"

          printf '%s' "$APPLE_CERTIFICATE_BASE64" | /usr/bin/base64 --decode > "$certificate_path"
          printf '%s' "$APPLE_NOTARY_KEY_BASE64" | /usr/bin/base64 --decode > "$api_key_path"
          chmod 600 "$certificate_path" "$api_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          if ! security find-identity -v -p codesigning "$keychain_path" \
            | grep -F -- "$APPLE_CODESIGN_IDENTITY" >/dev/null; then
            echo "APPLE_CODESIGN_IDENTITY was not imported" >&2
            exit 1
          fi

          xcrun notarytool store-credentials "$notary_profile" \
            --key "$api_key_path" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --keychain "$keychain_path" \
            --validate
      - name: Build, sign, notarize, and validate macOS package
        shell: bash
        env:
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          NEXKVM_RELEASE: "1"
        run: |
          set -euo pipefail
          package_version="$(cargo pkgid -p nexkvm)"
          package_version="${package_version##*@}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            package_version="${GITHUB_REF_NAME#v}"
          fi
          NEXKVM_VERSION="$package_version" bash scripts/package-macos.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nexkvm-macos-package
          if-no-files-found: error
          path: target/package/nexkvm-macos-arm64-*.zip
      - name: Remove temporary signing keychain
        if: always()
        shell: bash
        run: |
          if [[ -n "${APPLE_NOTARY_KEYCHAIN:-}" && -f "$APPLE_NOTARY_KEYCHAIN" ]]; then
            security delete-keychain "$APPLE_NOTARY_KEYCHAIN"
          fi

  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [package-macos]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: dist/nexkvm-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate and verify SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          test -s "dist/nexkvm-${GITHUB_REF_NAME}.spdx.json"
          (
            cd dist
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum
          ) > dist/SHA256SUMS
          (cd dist && sha256sum --check SHA256SUMS)
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
