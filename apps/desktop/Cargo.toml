[package]
name = "nexkvm"
description = "nexkvm desktop daemon — cross-platform device continuity."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "nexkvm"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
nexkvm-core.workspace = true
nexkvm-protocol.workspace = true
nexkvm-crypto.workspace = true
nexkvm-network.workspace = true
nexkvm-discovery.workspace = true
nexkvm-input.workspace = true
nexkvm-clipboard.workspace = true
nexkvm-streaming.workspace = true
nexkvm-plugins.workspace = true
nexkvm-storage.workspace = true
nexkvm-telemetry.workspace = true
anyhow.workspace = true
bytes.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
nexkvm-platform-macos.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nexkvm-platform-linux.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
nexkvm-platform-windows.workspace = true

[package.metadata.deb]
maintainer = "nexkvm contributors"
copyright = "2026, nexkvm contributors"
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
	["../../target/release/nexkvm", "usr/bin/nexkvm", "755"],
	["../../packaging/linux/nexkvm.desktop", "usr/share/applications/nexkvm.desktop", "644"],
	["../../packaging/assets/nexkvm-logo.png", "usr/share/icons/hicolor/512x512/apps/nexkvm.png", "644"],
	["../../README.md", "usr/share/doc/nexkvm/README.md", "644"],
]

[package.metadata.generate-rpm]
summary = "Cross-platform device continuity daemon"
release = "1"
assets = [
	{ source = "../../target/release/nexkvm", dest = "/usr/bin/nexkvm", mode = "755" },
	{ source = "../../packaging/linux/nexkvm.desktop", dest = "/usr/share/applications/nexkvm.desktop", mode = "644" },
	{ source = "../../packaging/assets/nexkvm-logo.png", dest = "/usr/share/icons/hicolor/512x512/apps/nexkvm.png", mode = "644" },
	{ source = "../../README.md", dest = "/usr/share/doc/nexkvm/README.md", mode = "644", doc = true },
]
