[package]
name = "nexkvm-platform-macos"
description = "macOS platform backend for nexkvm (input, clipboard, display)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
nexkvm-core.workspace = true
nexkvm-input.workspace = true
nexkvm-clipboard.workspace = true
nexkvm-streaming.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["rt"] }
tracing.workspace = true
bytes.workspace = true
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSString", "NSArray", "NSData", "NSAutoreleasePool"] }
objc2-app-kit = { version = "0.2", features = ["NSPasteboard", "NSPasteboardItem"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
