[package]
name = "nexkvm-streaming"
description = "Reliable/ordered media and bulk transfer streaming model for nexkvm."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = ["transfer-compression"]
transfer-compression = ["dep:flate2"]
# Hardware/codec features are API gates for now; concrete encoder backends land
# behind these flags in platform/runtime integration phases.
screen-h264 = []
screen-h265 = []
screen-nvenc = []
screen-vaapi = []
screen-videotoolbox = []

[dependencies]
nexkvm-core.workspace = true
nexkvm-crypto.workspace = true
bytes.workspace = true
async-trait.workspace = true
thiserror.workspace = true
serde.workspace = true
uuid.workspace = true
flate2 = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
