[package]
name = "coklu-clipboard"
description = "Clipboard synchronization model and access traits for coklu."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# `compression` pulls in the pure-Rust flate2/miniz_oxide backend for clipboard
# sync payload compression. Disabling it keeps the dependency footprint minimal;
# the wire format still negotiates per-update so an uncompressed peer interops.
default = ["compression"]
compression = ["dep:flate2"]

[dependencies]
coklu-core.workspace = true
bytes.workspace = true
async-trait.workspace = true
serde.workspace = true
thiserror.workspace = true
uuid.workspace = true
flate2 = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
